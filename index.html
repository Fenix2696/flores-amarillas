<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f2e8">
  <meta name="description" content="Este 21 de septiembre guardé algo bonito para ti. Toca el regalo y deja que florezca.">
  <title>Tengo algo para ti · 21 de septiembre</title>
  <style>
    :root { color-scheme:light; --paper:#f7f2e8; --ink:#473f38; --muted:#827368; --gold:#9a733c; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { margin:0; color:var(--ink); background:var(--paper); font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    body::before { content:""; position:fixed; inset:0; z-index:-1; background:radial-gradient(ellipse at 50% 50%,#fffdf3 0,#f7f2e8 52%,#eee6d8 100%); }
    button { font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
    button:focus-visible { outline:2px solid #9e7352; outline-offset:6px; }
    button:disabled { cursor:default; }
    [hidden] { display:none!important; }
    .experience { min-height:100svh; width:100%; padding:28px 16px 24px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .heading { text-align:center; position:relative; z-index:1; width:100%; }
    .occasion { color:var(--gold); letter-spacing:.25em; font-size:10px; text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:17px; margin:0 0 18px; }
    .occasion::before,.occasion::after { content:""; width:27px; height:1px; background:#b496684f; }
    h1 { font:400 clamp(34px,4.4vw,53px)/1.13 Georgia,"Times New Roman",serif; letter-spacing:-.035em; margin:0; min-height:1.15em; }
    h1 em { font-weight:400; color:#99703c; }
    .subtitle { margin:13px 0 0; color:var(--muted); font:italic 16px/1.6 Georgia,serif; min-height:26px; }
    .stage { position:relative; flex:none; width:min(760px,calc((100svh - 305px) * 1.16923),100%); min-width:260px; }
    .art { display:block; width:100%; height:auto; aspect-ratio:760/650; overflow:visible; }
    .gift-hit { position:absolute; left:24%; top:32%; width:53%; height:46%; border:0; border-radius:36%; cursor:pointer; background:transparent; }
    .gift-hit:focus-visible { outline:1px dashed #ad835b; outline-offset:5px; }
    .gift-hit:not(:disabled):hover { background:radial-gradient(ellipse,#ffffff13,transparent 65%); }
    .controls { text-align:center; min-height:75px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:8px; position:relative; z-index:2; }
    .hint { margin:0; color:#766557; font-size:12px; letter-spacing:.04em; }
    .actions { display:flex; align-items:center; justify-content:center; gap:20px; min-height:36px; }
    .quiet { padding:7px 4px; border:0; background:none; font-size:11px; color:#827467; cursor:pointer; }
    .quiet:hover { color:#523f2d; }
    .replay { padding:8px 0; border:0; border-bottom:1px solid #bba58a; background:transparent; color:#76614b; font-size:12px; cursor:pointer; }
    .replay svg { width:12px; height:12px; margin-right:8px; vertical-align:-1px; }
    .signature { font:italic 14px Georgia,serif; color:#947550; margin:1px 0 0; }
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .petal { stroke:#ae731d; stroke-width:.5; stroke-linejoin:round; }
    .petal-vein { fill:none; stroke:#fff3ad; stroke-width:.65; opacity:.43; }
    .stem { fill:none; stroke:url(#stem-color); stroke-width:3.1; stroke-linecap:round; }
    .stem-light { fill:none; stroke:#becb87; stroke-width:.65; opacity:.65; }
    noscript { display:block; max-width:340px; margin:auto; text-align:center; color:var(--muted); }
    @media(max-width:600px) {
      .experience { padding:26px 10px 20px; justify-content:center; }
      .occasion { font-size:9px; gap:12px; margin-bottom:19px; }
      h1 { font-size:clamp(31px,8.8vw,43px); }
      .subtitle { font-size:15px; padding:0 10px; }
      .stage { width:100%; margin:16px 0 10px; min-width:0; }
      .controls { min-height:82px; }
      .hint { font-size:11px; }
      .quiet,.replay { min-height:40px; }
    }
    @media(max-height:650px) and (min-width:601px) {
      .experience { padding:16px 12px; }
      .occasion { margin-bottom:8px; }
      h1 { font-size:33px; }
      .subtitle { margin-top:8px; font-size:14px; }
      .stage { width:min(560px,calc((100svh - 210px) * 1.16923)); }
      .controls { min-height:58px; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <main class="experience" id="experience" data-state="closed">
    <header class="heading">
      <p class="occasion">21 de septiembre <span aria-hidden="true">·</span> solo para ti</p>
      <h1 id="heading">Tengo algo <em>para ti</em></h1>
      <p class="subtitle" id="subtitle">Hay cosas que no caben en palabras.</p>
    </header>
    <div class="stage">
      <svg class="art" id="art" viewBox="0 0 760 650" role="img" aria-labelledby="art-title art-description">
        <title id="art-title">Un regalo esperando a que lo abras</title>
        <desc id="art-description">Una caja color rosa empolvado con un lazo de satén. Al abrirla, siete capullos amarillos se elevan y despliegan sus pétalos hasta formar un ramo.</desc>
        <defs>
          <radialGradient id="sunlight"><stop stop-color="#ffe8a1" stop-opacity=".65"/><stop offset=".62" stop-color="#efdaae" stop-opacity=".17"/><stop offset="1" stop-color="#efdaae" stop-opacity="0"/></radialGradient>
          <radialGradient id="floor"><stop stop-color="#7b6550" stop-opacity=".24"/><stop offset="1" stop-color="#7b6550" stop-opacity="0"/></radialGradient>
          <linearGradient id="box-front" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f3ded3"/><stop offset=".5" stop-color="#e8c9b9"/><stop offset="1" stop-color="#d4ab99"/></linearGradient>
          <linearGradient id="box-side" x1="0" x2="1"><stop stop-color="#c39786"/><stop offset="1" stop-color="#b38475"/></linearGradient>
          <linearGradient id="box-top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1e3"/><stop offset=".52" stop-color="#f3d9c7"/><stop offset="1" stop-color="#e1bda9"/></linearGradient>
          <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8c6356"/><stop offset="1" stop-color="#493b33"/></linearGradient>
          <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2=".7"><stop stop-color="#78493d"/><stop offset=".28" stop-color="#a86a52"/><stop offset=".46" stop-color="#d7a787"/><stop offset=".61" stop-color="#af795f"/><stop offset="1" stop-color="#754237"/></linearGradient>
          <linearGradient id="petal-back" x1="0" y1="1" x2=".65" y2="0"><stop stop-color="#b06a17"/><stop offset=".36" stop-color="#dca023"/><stop offset=".74" stop-color="#f4c845"/><stop offset="1" stop-color="#ffdf7b"/></linearGradient>
          <linearGradient id="petal-front" x1="0" y1="1" x2=".7" y2="0"><stop stop-color="#b87a16"/><stop offset=".32" stop-color="#e8b230"/><stop offset=".68" stop-color="#f8d35b"/><stop offset="1" stop-color="#fff0ac"/></linearGradient>
          <linearGradient id="leaf-color"><stop stop-color="#455d38"/><stop offset=".52" stop-color="#6c8450"/><stop offset="1" stop-color="#a3b773"/></linearGradient>
          <linearGradient id="stem-color"><stop stop-color="#4c6340"/><stop offset=".48" stop-color="#849459"/><stop offset="1" stop-color="#4c6740"/></linearGradient>
          <radialGradient id="flower-center" cx=".4" cy=".32"><stop stop-color="#c89b42"/><stop offset=".64" stop-color="#9f702d"/><stop offset="1" stop-color="#765027"/></radialGradient>
          <filter id="head-shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#6d4f25" flood-opacity=".2"/></filter>
          <filter id="box-shadow" x="-35%" y="-40%" width="175%" height="190%"><feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#68513d" flood-opacity=".16"/></filter>
          <filter id="soften"><feGaussianBlur stdDeviation="5"/></filter>
          <clipPath id="above-box"><path d="M40 30H730V470H40Z"/></clipPath>
        </defs>
        <ellipse id="ambient" cx="380" cy="290" rx="325" ry="282" fill="url(#sunlight)" opacity=".22"/>
        <g id="world">
          <ellipse cx="399" cy="603" rx="246" ry="32" fill="url(#floor)"/>
          <g id="lid-shadow" opacity="0"><ellipse cx="595" cy="584" rx="115" ry="19" fill="url(#floor)"/></g>
          <!-- The lid is behind the flowers and box when it comes to rest. -->
          <g id="lid" filter="url(#box-shadow)">
            <path d="M229 420 331 365 546 391 445 450Z" fill="url(#box-top)" stroke="#fce8d8" stroke-width="1"/>
            <path d="M229 420 445 450 445 475 229 445Z" fill="url(#box-front)"/>
            <path d="M445 450 546 391 546 416 445 475Z" fill="url(#box-side)"/>
            <path d="M322 433 358 438 460 381 424 376Z" fill="url(#ribbon)"/>
            <path d="M322 433 358 438 358 462 322 457Z" fill="url(#ribbon)"/>
            <path d="M445 448 546 390" stroke="#fff2de" stroke-opacity=".75" fill="none"/>
          </g>
          <!-- Interior and back rim. The closed lid is duplicated above this layer. -->
          <g id="box-back">
            <path d="M240 438 333 387 535 410 442 464Z" fill="url(#inside)" stroke="#c39784" stroke-width="3"/>
            <path d="M249 437 334 395 524 415 441 455Z" fill="#765845"/>
            <ellipse id="inner-light" cx="389" cy="435" rx="112" ry="22" fill="#ffdda0" opacity="0"/>
          </g>
          <g id="garden" clip-path="url(#above-box)">
            <g id="stems"></g>
            <g id="leaves"></g>
            <g id="flowers"></g>
          </g>
          <g id="box-front-group" filter="url(#box-shadow)">
            <path d="M240 438 442 464 442 591 240 559Z" fill="url(#box-front)"/>
            <path d="M442 464 535 410 535 538 442 591Z" fill="url(#box-side)"/>
            <path d="M240 438 442 464 535 410" fill="none" stroke="#f9e4d0" stroke-width="2"/>
            <path d="M324 449 359 453 359 578 324 573Z" fill="url(#ribbon)"/>
            <path d="M329 451 332 574" stroke="#ebc6a1" stroke-opacity=".4"/>
            <path d="M443 466V588" fill="none" stroke="#aa7c69" stroke-opacity=".5"/>
            <path d="M252 550 427 577" stroke="#c8a18b" stroke-opacity=".35"/>
            <g transform="translate(376 506) rotate(8)">
              <path d="M-17-19H24V24H-17L-26 2Z" fill="#fbf1df" stroke="#d4b998"/>
              <circle cx="-17" cy="2" r="2" fill="#ba987a"/>
              <path d="M-17 2Q-39-8-40-34" fill="none" stroke="#bd9778" stroke-width="1"/>
              <text x="2" y="1" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="9" fill="#92714d">para</text>
              <text x="2" y="13" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#92714d">ti</text>
            </g>
          </g>
          <g id="closed-lid"></g>
          <g id="bow" fill="none" stroke="url(#ribbon)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
            <path id="bow-left" d="M385 404C352 351 299 354 316 382C326 399 360 405 385 404"/>
            <path id="bow-right" d="M385 404C404 350 465 360 449 383C434 403 407 406 385 404"/>
            <path id="tail-left" d="M384 407C358 427 338 448 350 471" stroke-width="15"/>
            <path id="tail-right" d="M391 406C424 416 453 425 464 446" stroke-width="14"/>
            <path id="knot" d="M379 402Q387 396 395 405L393 414Q385 418 378 410Z" fill="url(#ribbon)" stroke-width="3"/>
          </g>
        </g>
      </svg>
      <button class="gift-hit" id="open-gift" aria-label="Abrir el regalo de flores amarillas" aria-describedby="hint" disabled></button>
    </div>
    <div class="controls">
      <p class="hint" id="hint">Toca el regalo para abrirlo</p>
      <div class="actions" id="actions">
        <button class="quiet" id="pause" hidden>Pausar</button>
        <button class="quiet" id="still" hidden>Ver sin animación</button>
        <button class="replay" id="replay" hidden><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 5a5.5 5.5 0 1 1-1 5M3 1v4h4"/></svg>Volver a abrir el regalo</button>
      </div>
      <p class="signature" id="signature" hidden>Porque qué bonito es coincidir contigo.</p>
    </div>
    <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <noscript>Estas flores amarillas son para ti. Para ver cómo se abre tu regalo, activa JavaScript en el navegador.</noscript>
  </main>
  <script>
    'use strict';
    (() => {
      // Original vector art; no downloaded assets, dependencies or network requests.
      // One deterministic timeline drives the ribbon, lid, curved paths and petal morphs.
      const $ = id => document.getElementById(id);
      const NS = 'http://www.w3.org/2000/svg';
      const el = (name, attrs = {}) => {
        const node = document.createElementNS(NS, name);
        for (const [key,value] of Object.entries(attrs)) node.setAttribute(key, String(value));
        return node;
      };
      const clamp = value => Math.max(0, Math.min(1, value));
      const mix = (a,b,t) => a+(b-a)*t;
      const smooth = value => { const t=clamp(value); return t*t*(3-2*t); };
      const easeOut = value => 1-Math.pow(1-clamp(value),3);
      const round = value => Math.round(value*100)/100;
      const point = (a,b,t) => [mix(a[0],b[0],t),mix(a[1],b[1],t)];
      const bezier = (points,t) => {
        const a=point(points[0],points[1],t), b=point(points[1],points[2],t), c=point(points[2],points[3],t);
        return point(point(a,b,t),point(b,c,t),t);
      };
      const path = points => 'M'+points[0].map(round).join(' ')+points.slice(1).map((p,i)=>(i%3===0?'C':' ')+p.map(round).join(' ')).join('');
      const morph = (from,to,t) => path(from.map((p,i)=>point(p,to[i],t)));
      const turn = (p,angle) => [p[0]*Math.cos(angle)-p[1]*Math.sin(angle),p[0]*Math.sin(angle)+p[1]*Math.cos(angle)];
      const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
      const duration=10200;
      const art=$('art'), world=$('world'), flowers=$('flowers'), stems=$('stems'), leaves=$('leaves');
      const hit=$('open-gift'), replay=$('replay'), pause=$('pause'), still=$('still');
      const lid=$('lid'), frontLid=$('closed-lid');
      // Keep the shut lid in front of the box until it has lifted clear of the rim.
      for(const child of [...lid.children]) frontLid.append(child.cloneNode(true));
      frontLid.setAttribute('filter','url(#box-shadow)');
      const ribbon={
        left:[[385,404],[352,351],[299,354],[316,382],[326,399],[360,405],[385,404]],
        looseLeft:[[385,404],[359,414],[294,388],[277,431],[263,466],[246,512],[235,529]],
        right:[[385,404],[404,350],[465,360],[449,383],[434,403],[407,406],[385,404]],
        looseRight:[[385,404],[421,388],[476,370],[523,402],[561,429],[570,468],[563,492]],
        tailLeft:[[384,407],[358,427],[338,448],[350,471]],
        longLeft:[[363,417],[324,463],[290,531],[247,568]],
        tailRight:[[391,406],[424,416],[453,425],[464,446]],
        longRight:[[423,411],[488,421],[536,509],[544,563]]
      };
      // Back to front: each flower has its own arrival, scale, tilt and trajectory.
      const settings=[
        {x:331,y:159,s:1.06,r:-13,delay:1800,travel:4400,bloom:3300,side:-1},
        {x:228,y:232,s:.88,r:-24,delay:2420,travel:4040,bloom:3000,side:-1},
        {x:433,y:215,s:.96,r:18,delay:2900,travel:4200,bloom:3100,side:1},
        {x:159,y:308,s:.65,r:-30,delay:3470,travel:3500,bloom:2760,side:-1},
        {x:303,y:297,s:.98,r:-5,delay:3970,travel:4040,bloom:3080,side:-1},
        {x:493,y:309,s:.74,r:29,delay:4500,travel:3650,bloom:2800,side:1},
        {x:402,y:333,s:.87,r:13,delay:4950,travel:3830,bloom:2900,side:1}
      ];
      const plants=settings.map((config,index)=>{
        const stem=el('path',{class:'stem'}), light=el('path',{class:'stem-light'});
        stems.append(stem,light);
        const leafNodes=[];
        for(let j=0;j<2;j++){
          const g=el('g');
          g.append(el('path',{d:'M0 0C-7-32-44-44-59-40C-45-5-19 7 0 0Z',fill:'url(#leaf-color)'}));
          g.append(el('path',{d:'M-3-2Q-30-23-52-36',stroke:'#ced598','stroke-width':'.8',fill:'none',opacity:'.6'}));
          leaves.append(g);leafNodes.push(g);
        }
        const root=el('g',{'data-flower':index});
        const head=el('g',{filter:'url(#head-shadow)'});
        const petals=[];
        // Closed shapes form overlapping, upright bud shells. They morph into
        // individually rotated Bézier petals, rather than scaling a flower image.
        for(let layer=0;layer<2;layer++){
          for(let i=0;i<13;i++){
            const angle=(i*360/13+layer*13+index*3)*Math.PI/180;
            const length=62-layer*9+Math.sin(i*2.8+index)*4;
            const width=17-layer*2;
            const open=[[0,3],[-width*.6,-length*.2],[-width,-length*.69],[-width*.2,-length*.97],[0,-length*1.1],[width,-length*.83],[width*.72,-length*.48],[width*.5,-length*.18],[width*.12,0],[0,3]].map(p=>turn(p,angle));
            const lean=Math.sin(angle)*6, height=41+Math.cos(angle)*5-layer*3;
            const closed=[[0,3],[-6+lean,-9],[-9+lean,-height*.65],[lean-1,-height],[lean+3,-height-4],[lean+10,-height*.7],[lean+7,-height*.4],[lean+5,-8],[1,1],[0,3]];
            const petal=el('path',{class:'petal',fill:layer?'url(#petal-front)':'url(#petal-back)',d:path(closed)+'Z'});
            const vein=el('path',{class:'petal-vein'});
            head.append(petal,vein);
            petals.push({petal,vein,closed,open,angle,length,offset:layer*270+i*27+Math.sin(i+index)*60});
          }
        }
        const center=el('g');
        center.append(el('circle',{r:16.5,fill:'url(#flower-center)',stroke:'#d3a345','stroke-width':'1'}));
        for(let n=0;n<72;n++){
          const r=1.7*Math.sqrt(n),a=n*2.399963;
          center.append(el('circle',{cx:round(Math.cos(a)*r),cy:round(Math.sin(a)*r),r:n%3===0?.95:.65,fill:n%3===0?'#efd080':'#704c27',opacity:'.8'}));
        }
        head.append(center);
        const sepals=el('g',{fill:'url(#leaf-color)'});
        const sepalLeft=el('path'),sepalRight=el('path');
        sepals.append(sepalLeft,sepalRight);head.append(sepals);
        root.append(head);flowers.append(root);
        const origin=[366+(index%3)*13,472];
        const route=[origin,[origin[0]+config.side*(82+index*3),398-index*4],[config.x-config.side*52,config.y-22],[config.x,config.y]];
        return {...config,root,head,petals,center,stem,light,leafNodes,origin,route,sepalLeft,sepalRight,lastBloom:-1};
      });
      let phase='closed', elapsed=0, raf=0, previousTime=null, paused=false, resumeOnVisible=false;
      const setPhase=value=>{phase=value;$('experience').dataset.state=value;};
      function render(time){
        const shift=smooth(time/1900);
        world.setAttribute('transform','translate(0 '+round(-88*(1-shift))+') translate(388 470) scale('+round(mix(1.17,1,shift))+') translate(-388 -470)');
        const untie=smooth((time-120)/1120);
        $('bow-left').setAttribute('d',morph(ribbon.left,ribbon.looseLeft,untie));
        $('bow-right').setAttribute('d',morph(ribbon.right,ribbon.looseRight,untie));
        $('tail-left').setAttribute('d',morph(ribbon.tailLeft,ribbon.longLeft,untie));
        $('tail-right').setAttribute('d',morph(ribbon.tailRight,ribbon.longRight,untie));
        $('knot').setAttribute('opacity',String(1-smooth((time-400)/440)));
        $('bow').setAttribute('opacity',String(1-smooth((time-1180)/650)));
        const lift=smooth((time-1020)/1950);
        const lidPosition=bezier([[0,0],[0,-192],[177,-139],[135,112]],lift);
        const lidTransform='translate('+lidPosition.map(round).join(' ')+') rotate('+round(19*lift)+' 388 425)';
        lid.setAttribute('transform',lidTransform);frontLid.setAttribute('transform',lidTransform);
        frontLid.setAttribute('opacity',time<1500?'1':'0');
        lid.setAttribute('opacity',time<1500?'0':'1');
        $('lid-shadow').setAttribute('opacity',String(smooth((time-2050)/900)));
        $('inner-light').setAttribute('opacity',String(.6*smooth((time-1300)/1000)));
        $('ambient').setAttribute('opacity',String(.22+.7*smooth((time-1900)/4900)));
        for(const plant of plants){
          const age=time-plant.delay, travel=smooth(age/plant.travel), visible=age>0;
          plant.root.setAttribute('visibility',visible?'visible':'hidden');
          plant.stem.setAttribute('visibility',visible?'visible':'hidden');
          plant.light.setAttribute('visibility',visible?'visible':'hidden');
          const [x,y]=bezier(plant.route,travel);
          const spin=mix(plant.r+plant.side*38,plant.r,travel)+Math.sin(travel*Math.PI)*plant.side*9;
          plant.root.setAttribute('transform','translate('+round(x)+' '+round(y)+') rotate('+round(spin)+') scale('+round(plant.s*mix(.64,1,easeOut(travel)))+' '+round(plant.s*mix(.74,.94,travel))+')');
          const stemPoints=[plant.origin,[plant.origin[0]+plant.side*13,plant.origin[1]-42],[x+plant.side*22,y+82],[x,y+3]];
          const stemPath=path(stemPoints);
          plant.stem.setAttribute('d',stemPath);plant.light.setAttribute('d',stemPath);
          const bloom=smooth((age-500)/plant.bloom);
          plant.leafNodes.forEach((leaf,j)=>{
            const pos=bezier(stemPoints,.36+j*.24);
            const growth=smooth((age-1100-j*240)/2200);
            leaf.setAttribute('visibility',visible?'visible':'hidden');
            leaf.setAttribute('transform','translate('+pos.map(round).join(' ')+') rotate('+(j===0?-12:135)+') scale('+round(growth*plant.s*(j===0?.95:.75))+')');
          });
          // Petal morphs are updated only while they are changing.
          const morphProgress=clamp(age/(plant.bloom+1200));
          if(morphProgress!==plant.lastBloom){
            for(const petal of plant.petals){
              const opened=smooth((age-550-petal.offset)/(plant.bloom-450));
              petal.petal.setAttribute('d',morph(petal.closed,petal.open,opened)+'Z');
              const v1=point([1,-6],turn([0,-10],petal.angle),opened);
              const v2=point([2,-22],turn([-2,-petal.length*.52],petal.angle),opened);
              const v3=point([0,-35],turn([0,-petal.length*.87],petal.angle),opened);
              petal.vein.setAttribute('d','M'+v1.map(round).join(' ')+'Q'+v2.map(round).join(' ')+' '+v3.map(round).join(' '));
            }
            const centerOpen=smooth((bloom-.26)/.65);
            plant.center.setAttribute('transform','scale('+round(.05+.95*centerOpen)+')');
            plant.center.setAttribute('opacity',String(centerOpen));
            plant.sepalLeft.setAttribute('d',morph([[0,5],[-19,-3],[-17,-27],[-6,-33]],[[0,5],[-15,13],[-30,0],[-29,-7]],bloom)+'Q-8 2 0 5Z');
            plant.sepalRight.setAttribute('d',morph([[0,5],[20,-2],[18,-28],[7,-34]],[[0,5],[16,13],[29,0],[30,-6]],bloom)+'Q8 2 0 5Z');
            plant.lastBloom=morphProgress;
          }
        }
      }
      function announce(message){$('announcement').textContent=message;}
      function finish(){
        cancelAnimationFrame(raf);raf=0;previousTime=null;elapsed=duration;render(duration);setPhase('open');paused=false;
        $('heading').innerHTML='Estas flores amarillas<br><em>son para ti</em>';
        $('subtitle').textContent='Ojalá te hagan sonreír tanto como tú a mí.';
        $('hint').hidden=true;pause.hidden=true;still.hidden=true;replay.hidden=false;$('signature').hidden=false;
        art.setAttribute('aria-label','Regalo abierto con un ramo de siete flores amarillas completamente florecidas');
        $('art-title').textContent='Un ramo de flores amarillas, solo para ti';
        announce('Estas flores amarillas son para ti. El regalo está abierto.');
      }
      function tick(now){
        if(phase!=='opening'||paused||document.hidden){previousTime=null;raf=0;return;}
        if(previousTime!==null)elapsed+=Math.min(now-previousTime,100);
        previousTime=now;render(elapsed);
        if(elapsed>=duration){finish();return;}
        raf=requestAnimationFrame(tick);
      }
      function reset(){
        cancelAnimationFrame(raf);raf=0;previousTime=null;elapsed=0;paused=false;resumeOnVisible=false;setPhase('closed');
        plants.forEach(p=>p.lastBloom=-1);render(0);
        $('heading').innerHTML='Tengo algo <em>para ti</em>';
        $('subtitle').textContent='Hay cosas que no caben en palabras.';
        $('hint').hidden=false;$('hint').textContent='Toca el regalo para abrirlo';
        $('signature').hidden=true;replay.hidden=true;pause.hidden=true;pause.textContent='Pausar';
        pause.setAttribute('aria-pressed','false');still.hidden=motionPreference.matches;hit.disabled=false;hit.hidden=false;
        art.removeAttribute('aria-label');$('art-title').textContent='Un regalo esperando a que lo abras';
        $('announcement').textContent='';
      }
      function openGift(withoutMotion=false,repeating=false){
        if(phase!=='closed')return;
        hit.disabled=true;hit.hidden=true;
        if(withoutMotion||motionPreference.matches){finish();return;}
        setPhase('opening');elapsed=repeating?-700:0;previousTime=null;
        $('hint').textContent='Un momento… lo bonito está floreciendo.';
        pause.hidden=false;still.hidden=false;announce('Se desata el lazo. Tu regalo está floreciendo.');
        raf=requestAnimationFrame(tick);
      }
      hit.addEventListener('click',()=>openGift());
      replay.addEventListener('click',()=>{reset();openGift(false,true);});
      still.addEventListener('click',()=>{if(phase==='closed')openGift(true);else finish();});
      pause.addEventListener('click',()=>{
        paused=!paused;pause.textContent=paused?'Continuar':'Pausar';pause.setAttribute('aria-pressed',String(paused));
        if(paused){cancelAnimationFrame(raf);raf=0;previousTime=null;}
        else{previousTime=null;raf=requestAnimationFrame(tick);}
      });
      // Never spend battery animating a hidden page; continue from the same frame.
      document.addEventListener('visibilitychange',()=>{
        if(document.hidden){resumeOnVisible=phase==='opening'&&!paused;cancelAnimationFrame(raf);raf=0;previousTime=null;}
        else if(resumeOnVisible&&phase==='opening'&&!paused){resumeOnVisible=false;raf=requestAnimationFrame(tick);}
      });
      motionPreference.addEventListener('change',()=>{
        if(motionPreference.matches&&phase==='opening')finish();
        if(phase==='closed')still.hidden=motionPreference.matches;
      });
      reset();
    })();
  </script>
</body>
</html>
