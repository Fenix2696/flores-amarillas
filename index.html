<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4c430">
  <title>Flores Amarillas 🌻</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #49360a;
      background: linear-gradient(160deg, #fffbe8 0%, #ffe78a 55%, #f4bf29 100%);
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(90%, 620px);
      padding: 3rem 2rem;
      text-align: center;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 28px;
      background: rgba(255,255,255,.48);
      box-shadow: 0 24px 70px rgba(117, 83, 0, .2);
      backdrop-filter: blur(12px);
    }

    .flower {
      display: inline-block;
      margin-bottom: 1rem;
      font-size: clamp(5rem, 15vw, 8rem);
      filter: drop-shadow(0 12px 12px rgba(105, 72, 0, .18));
      animation: sway 3s ease-in-out infinite;
      transform-origin: bottom center;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1;
      color: #8a6200;
    }

    p {
      max-width: 460px;
      margin: 1.25rem auto 0;
      font-size: clamp(1rem, 3vw, 1.25rem);
      line-height: 1.65;
    }

    .signature {
      display: block;
      margin-top: 1.5rem;
      font-weight: 700;
      color: #a07100;
    }

    .petal {
      position: fixed;
      top: -10vh;
      z-index: 1;
      font-size: 2rem;
      animation: fall linear infinite;
      user-select: none;
    }

    .petal:nth-child(1) { left: 8%; animation-duration: 9s; }
    .petal:nth-child(2) { left: 24%; animation-duration: 12s; animation-delay: -5s; }
    .petal:nth-child(3) { left: 45%; animation-duration: 10s; animation-delay: -2s; }
    .petal:nth-child(4) { left: 68%; animation-duration: 13s; animation-delay: -8s; }
    .petal:nth-child(5) { left: 88%; animation-duration: 11s; animation-delay: -4s; }

    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg) scale(1.05); }
    }

    @keyframes fall {
      to { transform: translateY(120vh) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .flower, .petal { animation: none; }
      .petal { display: none; }
    }
  </style>
</head>
<body>
  <span class="petal">🌼</span>
  <span class="petal">🌻</span>
  <span class="petal">🌼</span>
  <span class="petal">🌻</span>
  <span class="petal">🌼</span>

  <main class="card">
    <div class="flower" aria-hidden="true">🌻</div>
    <h1>Flores amarillas para ti</h1>
    <p>
      Porque hay personas que hacen los días más bonitos con solo existir.
      Hoy quiero recordarte lo especial que eres.
    </p>
    <span class="signature">Con cariño 💛</span>
  </main>
</body>
</html>
